# Static SPA + reverse proxy so the browser talks to one origin: the console
# serves the shell and forwards gateway API calls (same-origin, no CORS).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Gateway API — proxy to the compose service name. Bearer auth is handled by
  # the gateway itself; the console only stores the token in the browser.
  location /v1/ {
    proxy_pass http://stratagate-memory-gateway:43731;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-StrataGate-Gateway-Token $http_x_stratagate_gateway_token;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://stratagate-memory-gateway:43731;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 15s;
  }

  # History-mode SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
